name: Android ARM64 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build AdvancedNavigation for Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;28.1.13356709"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.1.13356709" >> "$GITHUB_ENV"

      - name: Install SCons
        run: python -m pip install scons==4.11.1

      - name: Build extension
        run: scons platform=android arch=arm64 target=template_debug

      - name: Upload Android library
        uses: actions/upload-artifact@v7
        with:
          name: AdvancedNavigation-Android-ARM64-Debug
          path: project/addons/advanced_ai_nav/bin/*
          if-no-files-found: error
